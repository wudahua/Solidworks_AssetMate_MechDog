[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solidworks-assetmate-mechdog"
version = "0.8.319"
description = "SolidWorks MCP toolkit: recolor assemblies, inspect structure, export previews — with the COM pitfalls documented."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wudahua" }]
keywords = ["solidworks", "mcp", "cad", "automation", "pywin32"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Computer Aided Design",
]
dependencies = [
    "mcp>=1.2.0,<2",
    "pywin32>=306; platform_system == 'Windows'",
    # render_drawing() and add_surface_finish(verify_render=True) need these. They used to
    # be only an optional extra, so the first render on a fresh install failed with
    # missing_dependency — and the fix (installing into the SERVER's venv, not the system
    # Python) was not discoverable. Rendering is part of the self-check loop, not a nicety.
    "Pillow>=10",
    "pypdfium2>=4",
]

[project.optional-dependencies]
# Kept so existing `pip install ".[png]"` invocations still resolve.
png = ["Pillow>=10", "pypdfium2>=4"]

[project.urls]
Homepage = "https://github.com/wudahua/Solidworks_AssetMate_MechDog"

[project.scripts]
solidworks-assetmate-mechdog = "solidworks_assetmate_mechdog.server:main"

[tool.setuptools.package-data]
# `_build_meta.json` carries the tag for installs without `.git` (tarball, wheel, sdist).
# Report 2026-11-09: a wheel built from the previous config had 30 files and NONE of them
# was this one, so the tag guard had no source and — at the time — silently passed.
"solidworks_assetmate_mechdog" = ["_build_meta.json"]

[tool.setuptools.packages.find]
where = ["src"]
